name: Release

# Triggered by pushing a v* tag — created by .github/workflows/tag-release.yml
# once a release PR (scripts/release.sh) merges, or by hand. Builds the
# release binaries on ubuntu-22.04 (both Go modules are pure Go; with
# CGO_ENABLED=0 the binaries are fully static, so no glibc floor applies),
# vendors the sidecar, and publishes tarball, .deb, .rpm and checksums to a
# GitHub Release. An existing tag can be rebuilt via workflow_dispatch
# (input: tag).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to (re)build"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NFPM_VERSION: "2.48.0"

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            nfpm_arch: x86_64
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            nfpm_arch: arm64
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The MyGo shell module (mygo-shell/go.mod) requires Go 1.27.3, so
      # pin the exact toolchain here — no GOTOOLCHAIN download needed.
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"

      - name: Install Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Parse version from the tag
        id: meta
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG (version $version)"

      - name: Build release binaries
        env:
          version: ${{ steps.meta.outputs.version }}
          arch: ${{ matrix.arch }}
        run: |
          mkdir -p build
          CGO_ENABLED=0 go -C engine-go build -trimpath -ldflags "-s -w" \
            -o "$GITHUB_WORKSPACE/build/pds-engine-go" ./cmd/pds-engine-go
          CGO_ENABLED=0 go -C mygo-shell build -trimpath -ldflags "-s -w" \
            -o "$GITHUB_WORKSPACE/build/proton-drive-sync" .

          # Smoke: both binaries must exist and the engine's flag parser
          # must answer --help (Go exits 0 for -help). The UI binary is
          # not run (it opens a window); version consistency is enforced
          # separately by scripts/check-versions.sh.
          test -x build/proton-drive-sync build/pds-engine-go
          build/pds-engine-go --help >/dev/null
          echo "smoke ok: $(file build/proton-drive-sync build/pds-engine-go)"

      - name: Vendor the sidecar
        run: |
          cd sidecar
          npm ci --no-audit --no-fund
          npx patch-package
          npm run typecheck

      - name: Stage the install tree
        run: |
          mkdir -p staging/bin \
                   staging/share/proton-drive-sync \
                   staging/share/applications \
                   staging/share/icons/hicolor/scalable/apps
          install -m755 build/proton-drive-sync staging/bin/
          install -m755 build/pds-engine-go staging/bin/
          cp -R sidecar staging/share/proton-drive-sync/sidecar
          rm -f staging/share/proton-drive-sync/sidecar/package-lock.json
          install -m644 packaging/linux/proton-drive-sync.desktop \
            staging/share/applications/proton-drive-sync.desktop
          install -m644 packaging/linux/icon.svg \
            staging/share/icons/hicolor/scalable/apps/proton-drive-sync.svg

      - name: Build the tarball
        env:
          version: ${{ steps.meta.outputs.version }}
          arch: ${{ matrix.arch }}
        run: |
          dir="proton-drive-sync-${version}-${arch}"
          mkdir -p dist
          cp -R staging "$dir"
          cp README.md LICENSE packaging/linux/install.sh "$dir/"
          tar -a -c -f "dist/${dir}.tar.xz" "$dir"

      - name: Build .deb and .rpm (nfpm)
        env:
          version: ${{ steps.meta.outputs.version }}
          arch: ${{ matrix.arch }}
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          mkdir -p dist
          PDS_VERSION="$version" PDS_ARCH="$arch" /tmp/nfpm package \
            --config packaging/nfpm.yaml --packager deb --target dist/
          PDS_VERSION="$version" PDS_ARCH="$arch" /tmp/nfpm package \
            --config packaging/nfpm.yaml --packager rpm --target dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
