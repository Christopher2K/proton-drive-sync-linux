name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep the debug target small on the 14 GB runner disk. Changing these
  # invalidates the cached target, so keep them stable.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Version sites must never drift: every crate inherits the workspace
  # version and scripts/release.sh mirrors it to the sidecar + Nix.
  versions:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-versions.sh

  tests:
    name: devenv tests
    runs-on: ubuntu-24.04
    # A from-scratch build is ~3 min on the 4-core runner; the FUSE e2e test
    # self-bounds at ~3 min worst case. 15 min leaves ample headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Nix packages cannot be setuid, so the FUSE e2e test uses the host's
      # privileged fusermount3. Everything else comes from devenv.
      - name: Install FUSE helper
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure devenv binary cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      # The toolchain only exists inside the devenv shell, so use a plain
      # target/registry cache keyed on the lockfiles instead of rust-cache.
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'devenv.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Build first and save the cache before running tests, so a failing test
      # cannot throw away the compiled artifacts.
      - name: Build test binaries
        run: devenv shell -- cargo test --locked --workspace --all-targets --no-run

      - name: Save Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'devenv.lock', 'rust-toolchain.toml') }}

      # Runs the same enterTest as `devenv test` locally: cargo tests plus
      # sidecar typecheck/tests.
      - name: Run tests
        run: devenv test
