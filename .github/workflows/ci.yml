name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Version sites must never drift: sidecar/package.json is the source of
  # truth and scripts/release.sh mirrors it to config.ts + the Nix files.
  versions:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-versions.sh

  tests:
    name: devenv tests
    runs-on: ubuntu-24.04
    # The Go engine battery is ~90s (longer cold, via the module cache
    # below); the sidecar leg is npm ci + typecheck + tests. 20 min
    # leaves ample headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Nix packages cannot be setuid, so the engine-go FUSE e2e tests
      # use the host's privileged fusermount3. Everything else comes
      # from devenv.
      - name: Install FUSE helper
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure devenv binary cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      # Go module + build cache for the engine-go leg (default GOPROXY,
      # online runners fetch on first run; warm cache thereafter).
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('engine-go/go.mod', 'engine-go/go.sum', 'devenv.lock') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Runs the same enterTest as `devenv test` locally: the Go engine
      # leg (go vet + go test -short in engine-go/) and the sidecar
      # typecheck/tests.
      - name: Run tests
        run: devenv test

      # Save even on failure so a failing leg still warms the cache.
      - name: Save Go cache
        if: '!cancelled()'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('engine-go/go.mod', 'engine-go/go.sum', 'devenv.lock') }}
