# git-cliff configuration — renders CHANGELOG.md from conventional commits
# (regenerated by `scripts/release.sh`; do not hand-edit CHANGELOG.md).
# Group names follow Keep a Changelog; release commit and version tags are
# handled by release.sh.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }}
{%- endfor %}
{%- endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  # The release commit itself must not appear in the changelog.
  { message = "^chore\\(release", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^build", group = "Miscellaneous" },
  { message = "^ci", group = "Miscellaneous" },
  # Fallback for non-conventional subjects (e.g. milestone squashes).
  { message = ".*", group = "Other" },
]
