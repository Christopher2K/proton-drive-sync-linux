[package]
name = "pds-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Menu-bar desktop shell for proton-drive-sync (unofficial)"

[[bin]]
name = "proton-drive-sync"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
gpui-tray = "0.3"
pds-core.workspace = true
pds-sidecar-client.workspace = true
pds-vfs-linux = { path = "../vfs-linux" }
fuser = "0.18"
rusqlite = { version = "0.35", features = ["bundled"] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
# Session-bus probe for a StatusNotifier host (same zbus major as gpui-tray).
zbus = { version = "6", default-features = false, features = ["default-rt"] }

[dev-dependencies]
tempfile.workspace = true
